<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650" fill="none">
  <title>Zaptec — fastighet, laddbox och bil</title>
  <desc>En villa i kvällsljus, en svart Zaptec-box och en röd och svart Multivan. Grafana lägger aktuella mätvärden ovanpå de tomma värdefälten.</desc>
  <defs>
    <linearGradient id="sky" x2="1200" y2="650" gradientUnits="userSpaceOnUse"><stop stop-color="#111D2D"/><stop offset=".55" stop-color="#101721"/><stop offset="1" stop-color="#101B23"/></linearGradient>
    <radialGradient id="halo"><stop stop-color="#427FA0" stop-opacity=".16"/><stop offset="1" stop-color="#427FA0" stop-opacity="0"/></radialGradient>
    <linearGradient id="wall" x1="150" y1="150" x2="360" y2="340" gradientUnits="userSpaceOnUse"><stop stop-color="#34485D"/><stop offset="1" stop-color="#1B2A3B"/></linearGradient>
    <linearGradient id="roof" x1="74" y1="142" x2="340" y2="203" gradientUnits="userSpaceOnUse"><stop stop-color="#5B7289"/><stop offset="1" stop-color="#293B50"/></linearGradient>
    <linearGradient id="glass" x2="1" y2="1"><stop stop-color="#E7B96E"/><stop offset="1" stop-color="#9C713A"/></linearGradient>
    <linearGradient id="charger" x1="510" y1="160" x2="630" y2="337" gradientUnits="userSpaceOnUse"><stop stop-color="#303438"/><stop offset=".4" stop-color="#1B1F23"/><stop offset="1" stop-color="#25292D"/></linearGradient>
    <linearGradient id="van-red" x1="760" y1="245" x2="825" y2="337" gradientUnits="userSpaceOnUse"><stop stop-color="#C94758"/><stop offset=".4" stop-color="#9F243B"/><stop offset="1" stop-color="#4B1328"/></linearGradient>
    <linearGradient id="van-black" x1="720" y1="163" x2="900" y2="248" gradientUnits="userSpaceOnUse"><stop stop-color="#41484B"/><stop offset=".3" stop-color="#222A2F"/><stop offset="1" stop-color="#0C141B"/></linearGradient>
    <linearGradient id="van-front" x1="1020" y1="247" x2="1040" y2="339" gradientUnits="userSpaceOnUse"><stop stop-color="#B53349"/><stop offset=".5" stop-color="#7F1A30"/><stop offset="1" stop-color="#411223"/></linearGradient>
    <linearGradient id="windows" x1="820" y1="194" x2="950" y2="259" gradientUnits="userSpaceOnUse"><stop stop-color="#294558"/><stop offset="1" stop-color="#101D2B"/></linearGradient>
    <linearGradient id="card" x2="1" y2="1"><stop stop-color="#1C2B3C"/><stop offset="1" stop-color="#142131"/></linearGradient>
    <linearGradient id="charge-card" x2="1" y2="1"><stop stop-color="#19342F"/><stop offset="1" stop-color="#142622"/></linearGradient>
    <pattern id="grid" width="52" height="26" patternUnits="userSpaceOnUse" patternTransform="skewX(-28)"><path d="M52 0H0V26" stroke="#52748C" stroke-opacity=".08"/></pattern>
    <filter id="soft"><feGaussianBlur stdDeviation="12"/></filter>
    <filter id="shadow" x="-.3" y="-.3" width="1.6" height="1.6"><feDropShadow dx="0" dy="12" stdDeviation="12" flood-color="#030A12" flood-opacity=".55"/></filter>
  </defs>
